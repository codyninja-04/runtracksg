<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · RunTrackSG</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f0fdf4; color: #0b1f14; font-family: system-ui, sans-serif; padding: 24px; box-sizing: border-box; }
      main { max-width: 360px; text-align: center; }
      h1 { font-size: 1.6rem; margin: 16px 0 8px; text-transform: uppercase; letter-spacing: 0.02em; }
      p { color: #3d5747; line-height: 1.6; margin: 0 0 20px; }
      button { background: #16a34a; color: #fff; border: 0; border-radius: 12px; padding: 12px 20px; font-weight: 600; font-size: 0.95rem; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" width="56" height="56" alt="" />
      <h1>No signal</h1>
      <p>Probably somewhere in MacRitchie. Your runs are safe. Log this one once you are back on a connection.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
